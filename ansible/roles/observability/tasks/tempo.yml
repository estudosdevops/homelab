---
- name: Configure Grafana repository
  ansible.builtin.import_tasks: grafana_repo.yml

- name: Ensure Tempo user exists
  ansible.builtin.user:
    name: tempo
    system: true
    shell: /usr/sbin/nologin

- name: Install Tempo
  ansible.builtin.apt:
    name: tempo
    state: present
    update_cache: true

- name: Create Tempo directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: tempo
    group: tempo
    mode: "0755"
  loop:
    - /etc/tempo
    - /var/lib/tempo
    - /var/lib/tempo/traces
    - /var/lib/tempo/wal

- name: Configure Tempo
  ansible.builtin.template:
    src: tempo/config.yml.j2
    dest: /etc/tempo/config.yml
    owner: tempo
    group: tempo
    mode: "0644"
  notify: Restart Tempo

- name: Enable Tempo
  ansible.builtin.systemd:
    name: tempo
    enabled: true
    state: started
