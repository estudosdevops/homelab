---
grafana:
  server:
    protocol: http
    public_protocol: https
    host: grafana.{{ domain }}
    port: 3000

  admin:
    username: admin
    password: "{{ grafana_admin_password }}"

  datasources:
    - name: Prometheus
      uid: prometheus
      type: prometheus
      access: proxy
      url: http://localhost:9090
      default: true

    - name: Alertmanager
      uid: alertmanager
      type: alertmanager
      url: http://localhost:9093
      implementation: prometheus
      handleGrafanaManagedAlerts: false
      default: false

    - name: Loki
      uid: loki
      type: loki
      url: http://localhost:3100
      default: false
      maxLines: 1000
      derivedFields:
        - name: TraceID
          matcherRegex: "(?:trace_id|traceID|traceid)=([a-zA-Z0-9]+)"
          datasourceUid: tempo
          urlDisplayLabel: "Ver Trace"

    - name: Tempo
      uid: tempo
      type: tempo
      url: http://localhost:3200
      default: false
      tracesToLogs:
        datasourceUid: loki
        query: '{job="$${__service.name}"} |= "$${__trace.id}"'

  templates:
    - src: grafana/config.ini.j2
      dest: /etc/grafana/grafana.ini
      group: grafana
      mode: "0640"

    - src: grafana/datasources.yml.j2
      dest: /etc/grafana/provisioning/datasources/datasources.yml
      group: grafana
      mode: "0644"

  plugins: []
