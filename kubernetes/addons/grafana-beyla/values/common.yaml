---
beyla:
  config:
    data:
      otel_metrics_export:
        endpoint: "http://grafana-alloy.grafana-alloy.svc.cluster.local:4317"
      otel_traces_export:
        endpoint: "http://grafana-alloy.grafana-alloy.svc.cluster.local:4317"

      attributes:
        kubernetes:
          enable: true
          cluster_name: "homelab-prod"

      discovery:
        services:
          - name: sample-api
            open_ports: 8080
            # Opcional: filtrar por namespace específico se preferir
            # k8s_namespace: "default"

  tolerations:
    - effect: NoSchedule
      operator: Exists
