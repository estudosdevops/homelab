---
beyla:
  config:
    data:
      otel_metrics_export:
        endpoint: "http://grafana-alloy.grafana-alloy.svc.cluster.local:4317"
      otel_traces_export:
        endpoint: "http://grafana-alloy.grafana-alloy.svc.cluster.local:4317"

      attributes:
        kubernetes:
          enable: true
          cluster_name: "homelab-prod"

      discovery:
        services:
          - name: sample-api
            open_ports: 8080
            # Opcional: filtrar por namespace específico se preferir
            # k8s_namespace: "default"

  volumeMounts:
    - name: sys-fs-bpf
      mountPath: /sys/fs/bpf
    - name: sys-kernel-debug
      mountPath: /sys/kernel/debug
    - name: sys-kernel-btf
      mountPath: /sys/kernel/btf
      readOnly: true

  volumes:
    - name: sys-fs-bpf
      hostPath:
        path: /sys/fs/bpf
    - name: sys-kernel-debug
      hostPath:
        path: /sys/kernel/debug
    - name: sys-kernel-btf
      hostPath:
        path: /sys/kernel/btf

  securityContext:
    privileged: true
    runAsUser: 0
  hostNetwork: true
  hostPID: true

  tolerations:
    - effect: NoSchedule
      operator: Exists
