beyla:
  # Configurações globais do Pod do Beyla (aninhadas sob o wrapper)
  hostPID: true # OBRIGATÓRIO: Permite ler os processos do nó do Talos
  hostNetwork: true # OBRIGATÓRIO: Permite interceptar o tráfego de rede do nó

  securityContext:
    privileged: true # OBRIGATÓRIO: Permite carregar programas eBPF no Talos
    capabilities:
      add:
        - SYS_ADMIN
        - SYS_PTRACE
        - BPF
        - PERFMON

  # Configuração interna do Beyla (o bloco que você já tinha)
  config:
    data:
      otel_metrics_export:
        endpoint: "http://cluster.local"

      otel_traces_export:
        endpoint: "http://cluster.local"

      attributes:
        kubernetes:
          enable: true
          cluster_name: "homelab"

      discovery:
        services:
          - open_ports: 8080

  env:
    BEYLA_EBPF_BTF_PATH: "/sys/kernel/btf/vmlinux"

  tolerations:
    - effect: NoSchedule
      operator: Exists
