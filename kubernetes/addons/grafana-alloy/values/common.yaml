---
alloy:
  controller:
    type: daemonset
    tolerations:
      - key: node-role.kubernetes.io/control-plane
        operator: Exists
        effect: NoSchedule

      - key: node-role.kubernetes.io/master
        operator: Exists
        effect: NoSchedule

    volumes:
      extra:
        - name: host-root
          hostPath:
            path: /

        - name: host-proc
          hostPath:
            path: /proc

        - name: host-sys
          hostPath:
            path: /sys

        - name: host-var-log
          hostPath:
            path: /var/log

  alloy:
    extraPorts:
      - name: otlp-grpc
        port: 4317
        targetPort: 4317
        protocol: TCP

      - name: otlp-http
        port: 4318
        targetPort: 4318
        protocol: TCP

    extraEnv:
      - name: NODE_NAME
        valueFrom:
          fieldRef:
            fieldPath: spec.nodeName

      - name: NODE_IP
        valueFrom:
          fieldRef:
            fieldPath: status.hostIP

      - name: CLUSTER_NAME
        value: homelab-prod

    mounts:
      extra:
        - name: host-root
          mountPath: /host/root
          readOnly: true

        - name: host-proc
          mountPath: /host/proc
          readOnly: true

        - name: host-sys
          mountPath: /host/sys
          readOnly: true

        - name: host-var-log
          mountPath: /var/log
          readOnly: true

    configMap:
      content: |-
        logging {
          level = "info"
        }

        // ===================================================================
        // 1. MÉTRICAS DO NODE (TALOS OS / HARDWARE)
        // ===================================================================
        prometheus.exporter.unix "node" {
          procfs_path = "/host/proc"
          sysfs_path  = "/host/sys"
          rootfs_path = "/host/root"

          disable_collectors = [
            "thermal_zone",
            "hwmon",
          ]
        }

        discovery.relabel "node" {
          targets = prometheus.exporter.unix.node.targets

          rule {
            target_label = "node"
            replacement  = sys.env("NODE_NAME")
          }

          rule {
            target_label = "instance"
            replacement  = sys.env("NODE_NAME")
          }

          rule {
            target_label = "nodename"
            replacement  = sys.env("NODE_NAME")
          }

          rule {
            target_label = "job"
            replacement  = "linux/node"
          }
        }

        prometheus.scrape "node" {
          targets         = discovery.relabel.node.output
          scrape_interval = "30s"
          forward_to      = [prometheus.remote_write.prometheus.receiver]
        }

        // ===================================================================
        // 2. MÉTRICAS DO CLUSTER (KUBE-STATE-METRICS)
        // ===================================================================
        discovery.relabel "kube_state_metrics" {
          targets = [{
            "__address__" = "kube-state-metrics.kube-system.svc.cluster.local:8080",
          }]

          rule {
            target_label = "job"
            replacement  = "kube-state-metrics"
          }
        }

        prometheus.scrape "kube_state_metrics" {
          targets         = discovery.relabel.kube_state_metrics.output
          scrape_interval = "30s"
          forward_to      = [prometheus.remote_write.prometheus.receiver]
        }

        // ===================================================================
        // 3. MÉTRICAS DOS CONTÊINERES (cAdvisor / KUBELET / TALOS)
        // ===================================================================
        discovery.relabel "cadvisor" {
          targets = [{
            "__address__" = sys.env("NODE_IP") + ":10250",
          }]

          rule {
            target_label = "node"
            replacement  = sys.env("NODE_NAME")
          }

          rule {
            target_label = "instance"
            replacement  = sys.env("NODE_NAME")
          }

          rule {
            target_label = "job"
            replacement  = "cadvisor"
          }
        }

        prometheus.scrape "cadvisor" {
          targets      = discovery.relabel.cadvisor.output
          metrics_path = "/metrics/cadvisor"
          scheme       = "https"

          tls_config {
            insecure_skip_verify = true
          }

          bearer_token_file = "/var/run/secrets/kubernetes.io/serviceaccount/token"

          scrape_interval = "30s"

          forward_to = [
            prometheus.remote_write.prometheus.receiver,
          ]
        }

        // ===================================================================
        // 4. MÉTRICAS DO KUBERNETES API SERVER
        // ===================================================================
        discovery.relabel "apiserver" {
          targets = [{
            "__address__" = "kubernetes.default.svc.cluster.local:443",
          }]

          rule {
            target_label = "job"
            replacement  = "apiserver"
          }
        }

        prometheus.scrape "apiserver" {
          targets      = discovery.relabel.apiserver.output
          scheme       = "https"

          tls_config {
            insecure_skip_verify = true
          }

          bearer_token_file = "/var/run/secrets/kubernetes.io/serviceaccount/token"

          scrape_interval = "30s"

          forward_to = [
            prometheus.remote_write.prometheus.receiver,
          ]
        }

        // ===================================================================
        // 5. MÉTRICAS DO COREDNS
        // ===================================================================
        discovery.kubernetes "coredns_pods" {
          role = "pod"

          namespaces {
            names = ["kube-system"]
          }
        }

        discovery.relabel "coredns" {
          targets = discovery.kubernetes.coredns_pods.targets

          rule {
            source_labels = [
              "__meta_kubernetes_pod_container_port_number",
            ]

            action = "keep"
            regex  = "9153"
          }

          rule {
            target_label = "job"
            replacement  = "coredns"
          }
        }

        prometheus.scrape "coredns" {
          targets         = discovery.relabel.coredns.output
          scrape_interval = "30s"

          forward_to = [
            prometheus.remote_write.prometheus.receiver,
          ]
        }

        // ===================================================================
        // 6. LOGS DOS PODS
        // ===================================================================
        discovery.kubernetes "pods" {
          role = "pod"

          selectors {
            role  = "pod"
            field = "spec.nodeName=" + sys.env("NODE_NAME")
          }
        }

        discovery.relabel "pods" {
          targets = discovery.kubernetes.pods.targets

          rule {
            source_labels = ["__meta_kubernetes_namespace"]
            target_label  = "namespace"
          }

          rule {
            source_labels = ["__meta_kubernetes_pod_name"]
            target_label  = "pod"
          }

          rule {
            source_labels = ["__meta_kubernetes_pod_container_name"]
            target_label  = "container"
          }

          rule {
            source_labels = ["__meta_kubernetes_pod_node_name"]
            target_label  = "node"
          }

          rule {
            source_labels = [
              "__meta_kubernetes_pod_label_app_kubernetes_io_name",
            ]

            target_label = "app"
          }

          rule {
            source_labels = [
              "__meta_kubernetes_pod_label_app",
            ]

            target_label = "app"
          }

          rule {
            target_label = "cluster"
            replacement  = sys.env("CLUSTER_NAME")
          }

          rule {
            target_label = "platform"
            replacement  = "kubernetes"
          }

          rule {
            target_label = "environment"
            replacement  = "production"
          }

          rule {
            target_label = "job"
            replacement  = "kubernetes/pods"
          }
        }

        loki.source.kubernetes "pods" {
          targets = discovery.relabel.pods.output

          forward_to = [
            loki.process.cri.receiver,
          ]
        }

        loki.process "cri" {
          forward_to = [
            loki.write.loki.receiver,
          ]

          stage.cri {}

          stage.labels {
            values = {
              stream = "stream",
            }
          }
        }

        // ===================================================================
        // 7. OTLP RECEIVER
        // ===================================================================
        otelcol.receiver.otlp "applications" {
          grpc {
            endpoint = "0.0.0.0:4317"
          }

          http {
            endpoint = "0.0.0.0:4318"
          }

          output {
            metrics = [
              otelcol.processor.batch.application_metrics.input,
            ]

            traces = [
              otelcol.processor.batch.application_traces.input,
            ]
          }
        }


        // ===================================================================
        // 8. BATCH - MÉTRICAS DAS APLICAÇÕES
        // ===================================================================
        otelcol.processor.batch "application_metrics" {
          output {
            metrics = [
              otelcol.exporter.prometheus.application.input,
            ]
          }
        }

        // ===================================================================
        // 9. OTLP METRICS → PROMETHEUS
        // ===================================================================
        otelcol.exporter.prometheus "application" {
          forward_to = [
            prometheus.remote_write.prometheus.receiver,
          ]
        }

        // ===================================================================
        // 10. BATCH - TRACES DAS APLICAÇÕES
        // ===================================================================
        otelcol.processor.batch "application_traces" {
          output {
            traces = [
              otelcol.exporter.otlp.tempo.input,
            ]
          }
        }

        // ===================================================================
        // 11. OTLP TRACES → TEMPO
        // ===================================================================
        otelcol.exporter.otlp "tempo" {
          client {
            endpoint = "192.168.20.21:4317"

            tls {
              insecure = true
            }
          }
        }

        // ===================================================================
        // 12. PROMETHEUS REMOTE WRITE
        // ===================================================================
        prometheus.remote_write "prometheus" {
          external_labels = {
            cluster     = sys.env("CLUSTER_NAME"),
            datacenter  = "home",
            platform    = "kubernetes",
            environment = "production",
          }

          endpoint {
            url = "http://192.168.20.21:9090/api/v1/write"
          }
        }

        // ===================================================================
        // 13. LOKI
        // ===================================================================
        loki.write "loki" {
          external_labels = {
            cluster     = sys.env("CLUSTER_NAME"),
            datacenter  = "home",
            platform    = "kubernetes",
            environment = "production",
          }

          endpoint {
            url = "http://192.168.20.21:3100/loki/api/v1/push"
          }
        }
