---
alloy:
  controller:
    tolerations:
      - key: node-role.kubernetes.io/control-plane
        operator: Exists
        effect: NoSchedule
      - key: node-role.kubernetes.io/master
        operator: Exists
        effect: NoSchedule

    volumes:
      extra:
        - name: host-root
          hostPath:
            path: /
        - name: host-proc
          hostPath:
            path: /proc
        - name: host-sys
          hostPath:
            path: /sys

  alloy:
    extraEnv:
      - name: NODE_NAME
        valueFrom:
          fieldRef:
            fieldPath: spec.nodeName
      - name: NODE_IP
        valueFrom:
          fieldRef:
            fieldPath: status.hostIP
      - name: CLUSTER_NAME
        value: homelab-prod

    mounts:
      extra:
        - name: host-root
          mountPath: /host/root
          readOnly: true
        - name: host-proc
          mountPath: /host/proc
          readOnly: true
        - name: host-sys
          mountPath: /host/sys
          readOnly: true

    configMap:
      content: |-
        logging {
          level = "info"
        }

        prometheus.exporter.unix "node" {
          procfs_path = "/host/proc"
          sysfs_path  = "/host/sys"
          rootfs_path = "/host/root"
        }

        discovery.relabel "node" {
          targets = prometheus.exporter.unix.node.targets

          rule {
            target_label = "node_name"
            replacement  = sys.env("NODE_NAME")
          }

          rule {
            target_label = "job"
            replacement  = "linux/node"
          }
        }

        prometheus.scrape "node" {
          targets         = discovery.relabel.node.output
          scrape_interval = "30s"
          forward_to      = [prometheus.remote_write.prometheus.receiver]
        }

        discovery.relabel "kube_state_metrics" {
          targets = [{
            "__address__" = "kube-state-metrics.kube-system.svc.cluster.local:8080",
          }]

          rule {
            target_label = "job"
            replacement  = "kube-state-metrics"
          }
        }

        prometheus.scrape "kube_state_metrics" {
          targets         = discovery.relabel.kube_state_metrics.output
          scrape_interval = "30s"
          forward_to      = [prometheus.remote_write.prometheus.receiver]
        }

        discovery.relabel "cadvisor" {
          targets = [{
            "__address__" = sys.env("NODE_IP") + ":10250",
          }]

          rule {
            target_label = "job"
            replacement  = "cadvisor"
          }
        }

        prometheus.scrape "cadvisor" {
          targets      = discovery.relabel.cadvisor.output
          metrics_path = "/metrics/cadvisor"
          scheme       = "https"

          tls_config {
            insecure_skip_verify = true
          }
          bearer_token_file = "/var/run/secrets/kubernetes.io/serviceaccount/token"

          scrape_interval = "30s"
          forward_to      = [prometheus.remote_write.prometheus.receiver]
        }

        prometheus.remote_write "prometheus" {
          external_labels = {
            cluster     = sys.env("CLUSTER_NAME"),
            datacenter  = "home",
            platform    = "kubernetes",
            environment = "production",
          }

          endpoint {
            url = "http://192.168.20.21:9090/api/v1/write"
          }
        }
